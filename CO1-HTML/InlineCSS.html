<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body>
     <header>
    <h1 style="color: rgb(239, 246, 33); text-align: center;">
        Welcome to KL University
    </h1>
    <img src="KL-University.jpg" width="300" alt="KL-University" style="display: block; margin: 0 auto;">
     </header>

    
    <p style="color: green; font-size: 20px;">
        This paragraph uses inline CSS.
    </p>

    <h2 style="background-color: yellow; padding: 10px;">
        Full Stack Frontend Development
    </h2>

    <button style="background-color: blue;
                   color: white;
                   padding: 10px 20px;
                   border: none;">
        Click Me
    </button>

</body>
</html>
